name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Reject private files and detect credentials
        run: python scripts/check_public_tree.py
      - name: Install PDF toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended poppler-utils
      - name: Bootstrap from a clean clone
        run: ./scripts/setup.sh
      - name: Install development tools
        run: .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Static checks and regression tests
        run: |
          make check
          make test
          make demo
      - name: Audit runtime dependencies
        if: matrix.python == '3.12'
        run: .venv/bin/python -m pip_audit -r requirements.txt --strict
